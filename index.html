<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>bd-always-prayer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="wallpaper" aria-live="polite">
      <canvas class="particle-canvas" id="particleCanvas" aria-hidden="true"></canvas>
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>
      <div class="shade" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <button class="library-toggle" id="libraryToggle" type="button" aria-label="Manage local prayer library">
        <span class="library-toggle-line"></span>
        <span class="library-toggle-line"></span>
        <span class="library-toggle-line"></span>
      </button>

      <section class="quote-stage" id="quoteStage">
        <p class="quote-text" id="quoteText"></p>
        <p class="quote-meta" id="quoteMeta"></p>
      </section>

      <section class="error-state" id="errorState" hidden>
        <p class="error-title">Unable to load prayer data</p>
        <p class="error-message" id="errorMessage"></p>
      </section>

      <section class="library-panel" id="libraryPanel" role="dialog" aria-modal="true" aria-labelledby="libraryTitle" hidden>
        <button class="library-backdrop" id="libraryBackdrop" type="button" aria-label="Close local prayer library"></button>

        <div class="library-sheet">
          <header class="library-header">
            <div>
              <h2 id="libraryTitle">Local Library</h2>
              <p id="libraryCount">0 saved</p>
            </div>
            <button class="library-close" id="libraryClose" type="button" aria-label="Close local prayer library">
              <span></span>
              <span></span>
            </button>
          </header>

          <div class="library-body">
            <aside class="library-list-pane" aria-label="Local prayer library">
              <div class="library-actions">
                <button class="library-icon-button" id="libraryNew" type="button" aria-label="New local prayer" title="New local prayer">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"></path>
                  </svg>
                </button>
                <button class="library-icon-button" id="libraryExport" type="button" aria-label="Export local library" title="Export local library">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3v12"></path>
                    <path d="m7 10 5 5 5-5"></path>
                    <path d="M5 21h14"></path>
                  </svg>
                </button>
                <button class="library-icon-button" id="libraryImportDefault" type="button" aria-label="Import default prayers" title="Import default prayers">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 4v6h6"></path>
                    <path d="M20 20v-6h-6"></path>
                    <path d="M20 9a8 8 0 0 0-13.5-3.5L4 8"></path>
                    <path d="M4 15a8 8 0 0 0 13.5 3.5L20 16"></path>
                  </svg>
                </button>
                <button class="library-icon-button" id="libraryImport" type="button" aria-label="Import local JSON file" title="Import local JSON file">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path>
                    <path d="M14 3v5h5"></path>
                    <path d="M12 17V9"></path>
                    <path d="m8 13 4-4 4 4"></path>
                  </svg>
                </button>
                <button class="library-icon-button" id="libraryImportEndpoint" type="button" aria-label="Import from API endpoint" title="Import from API endpoint">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M16 16.5h1.5a3.5 3.5 0 0 0 .4-7A5.6 5.6 0 0 0 7.2 7.9 4.3 4.3 0 0 0 7.5 16.5H9"></path>
                    <path d="M12 10v9"></path>
                    <path d="m8.5 13.5 3.5-3.5 3.5 3.5"></path>
                  </svg>
                </button>
                <input id="libraryImportInput" type="file" accept="application/json,.json" hidden>
              </div>
              <form class="library-endpoint-import" id="libraryEndpointImport" hidden>
                <input id="libraryEndpointUrl" type="url" autocomplete="off" placeholder="https://...">
                <button class="library-icon-button" id="libraryEndpointLoad" type="submit" aria-label="Import endpoint" title="Import endpoint">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m5 12 4 4L19 6"></path>
                  </svg>
                </button>
              </form>
              <div class="library-list" id="libraryList"></div>
              <p class="library-empty" id="libraryEmpty">No local prayers yet.</p>
            </aside>

            <form class="library-form" id="libraryForm">
              <input id="libraryEntryId" type="hidden">

              <label>
                <span>Title</span>
                <input id="libraryEntryTitle" type="text" autocomplete="off" placeholder="Optional">
              </label>

              <label>
                <span>Source</span>
                <input id="libraryEntrySource" type="text" autocomplete="off" placeholder="Optional">
              </label>

              <div class="library-form-row">
                <label>
                  <span>Script</span>
                  <select id="libraryEntryLang">
                    <option value="">Auto</option>
                    <option value="ar">Arabic</option>
                    <option value="en">English</option>
                  </select>
                </label>

                <label>
                  <span>Direction</span>
                  <select id="libraryEntryDir">
                    <option value="">Auto</option>
                    <option value="rtl">RTL</option>
                    <option value="ltr">LTR</option>
                  </select>
                </label>
              </div>

              <label class="library-lines-label">
                <span>Lines</span>
                <textarea id="libraryEntryLines" rows="8" spellcheck="false"></textarea>
              </label>

              <div class="library-preview" id="libraryPreview" aria-live="polite">
                <p class="library-preview-text" id="libraryPreviewText"></p>
                <p class="library-preview-meta" id="libraryPreviewMeta"></p>
              </div>

              <p class="library-status" id="libraryStatus" aria-live="polite"></p>

              <div class="library-submit-row">
                <button id="libraryDelete" class="library-danger" type="button">Delete</button>
                <button id="librarySave" type="submit">Save</button>
              </div>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="particles.js"></script>
    <script src="script.js"></script>
  </body>
</html>
